<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FD98B"/>
      <stop offset="1" stop-color="#0E9F6E"/>
    </linearGradient>
    <linearGradient id="dino" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B5E3F"/>
      <stop offset="1" stop-color="#0C3F29"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3EE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#043A25" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded-rect app background (macOS squircle-ish) -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="#FFFFFF" opacity="0.06"/>

  <!-- Clipboard behind the dino -->
  <g filter="url(#soft)">
    <rect x="316" y="250" width="392" height="512" rx="46" fill="url(#board)"/>
    <!-- clip at top -->
    <rect x="452" y="214" width="120" height="70" rx="26" fill="#0C3F29"/>
    <rect x="470" y="196" width="84" height="44" rx="22" fill="#134E33"/>
    <!-- lines on the board -->
    <g fill="#0E9F6E" opacity="0.28">
      <rect x="366" y="356" width="292" height="26" rx="13"/>
      <rect x="366" y="420" width="230" height="26" rx="13"/>
      <rect x="366" y="484" width="266" height="26" rx="13"/>
      <rect x="366" y="548" width="188" height="26" rx="13"/>
    </g>
  </g>

  <!-- Friendly T-Rex sitting in front of the clipboard -->
  <g filter="url(#soft)">
    <!-- tail -->
    <path d="M300 690
             C220 700 176 660 150 612
             C210 636 250 636 300 620 Z" fill="url(#dino)"/>
    <!-- body + head -->
    <path d="M300 700
             C286 560 320 470 430 452
             C470 300 640 300 690 430
             C740 440 764 500 742 556
             C726 596 682 612 636 606
             C640 660 616 704 560 720
             C620 730 654 742 654 742
             L440 742
             C440 742 380 742 356 726
             C332 742 300 742 300 700 Z" fill="url(#dino)"/>
    <!-- belly highlight -->
    <path d="M360 706 C352 620 372 548 452 520 C420 590 424 662 470 706 Z"
          fill="#2FD98B" opacity="0.35"/>
    <!-- legs -->
    <path d="M470 720 h60 v46 a30 30 0 0 1 -60 0 Z" fill="url(#dino)"/>
    <path d="M556 716 h58 v50 a29 29 0 0 1 -58 0 Z" fill="url(#dino)"/>
    <!-- tiny arm -->
    <path d="M600 520 c34 6 52 26 54 52 c-24 -10 -40 -8 -58 2 Z" fill="#0C3F29"/>
    <!-- eye -->
    <circle cx="642" cy="404" r="20" fill="#FFFFFF"/>
    <circle cx="649" cy="406" r="10" fill="#0C1F16"/>
    <!-- nostril -->
    <circle cx="694" cy="430" r="7" fill="#0C1F16" opacity="0.55"/>
    <!-- back spikes -->
    <g fill="#2FD98B">
      <path d="M470 452 l22 -30 l20 30 Z"/>
      <path d="M512 440 l22 -32 l22 32 Z"/>
      <path d="M556 440 l22 -30 l20 30 Z"/>
    </g>
  </g>
</svg>
